$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

display_name: rf-sweep-job
experiment_name: 911-call-sweep

compute: azureml:lab4-cluster

trial:
  command: >-
    python train_evaluate.py
    --train_data ${{inputs.train_data}}
    --test_data ${{inputs.test_data}}
    --n_estimators ${{search_space.n_estimators}}
    --max_depth ${{search_space.max_depth}}
    --smote_k ${{search_space.smote_k}}
    --use_smote ${{search_space.use_smote}}
    --model_output ${{outputs.model_output}}
    --evaluation_metrics ${{outputs.evaluation_metrics}}
    --test_predictions ${{outputs.test_predictions}}

  code: ../components/train_evaluate
  environment:
    image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
    conda_file: ../components/train_evaluate/conda.yml

inputs:
  train_data:
    type: uri_folder
    path: azureml:911_train_filtered@latest
  test_data:
    type: uri_folder
    path: azureml:911_test_filtered@latest

outputs:
  model_output:
    type: uri_folder
  evaluation_metrics:
    type: uri_folder
  test_predictions:
    type: uri_folder

search_space:
  n_estimators:
    type: choice
    values: [50, 100, 200]

  max_depth:
    type: choice
    values: [5, 10, 20]

  smote_k:
    type: choice
    values: [3, 5]

  use_smote:
    type: choice
    values: [0, 1]

objective:
  goal: maximize
  primary_metric: f1_macro

sampling_algorithm: random

limits:
  max_total_trials: 8
  max_concurrent_trials: 2